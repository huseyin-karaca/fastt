site_name: FASTT
site_description: >-
  FASTT chooses one pretrained speech recognizer per clip from the experts' own encoder states, learning a feature
  transformation and a selector together under the expected word error rate, and decodes with the chosen expert only.
site_url: https://huseyin-karaca.github.io/fastt/
repo_url: https://github.com/huseyin-karaca/fastt
repo_name: huseyin-karaca/fastt
# TODO (after acceptance): add the DOI and the journal reference to the citation (docs/index.md, overrides/home.html).
copyright: Code Apache-2.0 · data under each corpus's licence
theme:
  name: material
  custom_dir: overrides
  font: false                      # Schibsted Grotesk and JetBrains Mono come from docs/stylesheets/extra.css
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - content.tabs.link
nav:
  - Home: index.md
  - Method: method.md
  - Results: results.md
  - Reproduce:
      - Reproduce the paper: reproduce.md
      - Reproducibility report: reproducibility.md
      - The notebooks: notebooks.md
      - Data and licences: data.md
      - The package: package.md
exclude_docs: |
  snippets/
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.blocks.tab:
      alternate_style: true
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true
