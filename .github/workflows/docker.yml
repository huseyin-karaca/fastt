# Build the container and push it to ghcr.io/huseyin-karaca/fastt:cpu (docker/Dockerfile, levels 1 and 2), once
# when the repository is made public (the `public` event), then by hand (Actions → docker → Run workflow). The
# package is linked to this repository and takes its visibility. Nothing runs while the repository is private.
name: docker
on:
  workflow_dispatch:
    inputs:
      suffix:
        description: "optional tag suffix, e.g. -v1 gives :cpu-v1"
        default: ""
  public:

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:cpu${{ inputs.suffix }}
